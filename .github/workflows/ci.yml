name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Install musl-tools
        run: sudo apt-get install -y musl-tools

      - name: Build (musl static)
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Clippy
        run: cargo clippy --all-targets --locked --target x86_64-unknown-linux-musl -- -D warnings

      # Runs on the host target: the musl tests would need a musl runner, and
      # these cover parsing and wire formats, which are target-independent.
      #
      # The count is asserted because a suite that stops being discovered  -
      # a renamed file, a broken import, a mod that stops being compiled  -
      # exits 0 and leaves this step green while testing nothing. That is the
      # failure this project already shipped once.
      - name: Unit tests
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee cargo-test.log
          grep -qE 'running [1-9][0-9]* tests?' cargo-test.log \
            || { echo "::error::no Rust tests were discovered"; exit 1; }

      # The plugin is a separate implementation in Python; nothing above tests
      # it. Stdlib unittest only, no pytest, so there is nothing to install.
      #
      # unittest returns 5 for "no tests ran" only since Python 3.12; the
      # ubuntu-22.04 runner ships 3.10, where it returns 0. Assert the count
      # rather than depend on the runner's interpreter version.
      - name: Collectd plugin tests
        run: |
          set -o pipefail
          python3 --version
          python3 -m unittest discover -s plugin/collectd -v 2>&1 | tee plugin-test.log
          grep -qE '^Ran [1-9][0-9]* tests?' plugin-test.log \
            || { echo "::error::no collectd plugin tests were discovered"; exit 1; }

      - name: Confirm binary is fully static
        run: |
          file target/x86_64-unknown-linux-musl/release/wire-probe
          ldd target/x86_64-unknown-linux-musl/release/wire-probe 2>&1 \
            | grep -qE "not a dynamic|statically linked" \
            && echo "OK: statically linked" \
            || (echo "FAIL: unexpected dynamic linkage" && exit 1)

      - name: Smoke test  -  server starts
        run: |
          ./target/x86_64-unknown-linux-musl/release/wire-probe \
            --mode server --port 19999 &
          sleep 0.3
          kill %1

      - name: Smoke test  -  probe fails cleanly on refused port
        run: |
          ./target/x86_64-unknown-linux-musl/release/wire-probe \
            --mode probe --target 127.0.0.1:1 \
            --timeout 200ms --interval 5000ms \
            --export collectd-exec 2>&1 | grep -q "probe error" \
            && echo "OK" || (echo "FAIL: expected probe error" && exit 1)

      - name: Smoke test  -  package tarball
        run: |
          DIR="wire-probe-ci-linux-x86_64"
          mkdir "$DIR"
          cp target/x86_64-unknown-linux-musl/release/wire-probe "$DIR/"
          tar czf "${DIR}.tar.gz" "$DIR/"
          tar tzf "${DIR}.tar.gz"

      # The failure metric is the reason this project exists; assert the wire
      # output, not just that the process printed an error.
      - name: Smoke test  -  a failed probe still exports a value
        run: |
          ./target/x86_64-unknown-linux-musl/release/wire-probe \
            --mode probe --target 127.0.0.1:1 \
            --timeout 200ms --interval 5000ms \
            --export collectd-exec 2>/dev/null | head -1 | grep -q "N:U$" \
            && echo "OK" || (echo "FAIL: expected N:U for a failed probe" && exit 1)

  # Guards rust-version in Cargo.toml: without this, the declared MSRV is a
  # comment nobody checks, which is how it drifted to 1.70 before.
  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - name: Build and test on the declared minimum
        run: cargo test --locked
