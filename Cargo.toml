[package]
name = "wire-probe"
version = "0.1.7"
edition = "2024"
# Edition 2024 requires 1.85; without this Cargo fails with an opaque
# "feature `edition2024` is required" instead of naming the toolchain.
rust-version = "1.85"
description = "Zero-footprint L4 telemetry agent: TCP handshake RTT, sub-1 MB RAM, no runtime deps"
license = "MIT"
repository = "https://github.com/vorjdux/wire-probe"
homepage = "https://github.com/vorjdux/wire-probe"
readme = "README.md"
keywords = ["monitoring", "latency", "telemetry", "collectd", "telegraf"]
categories = ["command-line-utilities", "network-programming"]

[lints.rust]
# unreachable_pub is deliberately NOT here: it wants pub(crate) on every item,
# while clippy::redundant_pub_crate (nursery, enabled below) wants plain pub
# inside private modules. In a binary crate both spellings give identical
# reachability, so the two lints are unsatisfiable together and the clippy one
# is kept.
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Picked out of `restriction`, which is deliberately contradictory as a whole
# (it wants explicit `return`, bans `?`, and prefers `core` over `std`).
undocumented_unsafe_blocks = "warn"
arithmetic_side_effects = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# panic = "abort" means any panic kills the agent, so indexing and modulo  -
# the two operations here that can panic on their own  -  are opt-in per site.
indexing_slicing = "warn"
modulo_arithmetic = "warn"

[dependencies]
io-uring = "0.7"
pico-args = "0.5"
itoa = "1.0"
ryu = "1.0"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
