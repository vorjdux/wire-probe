[package]
name = "wire-probe"
version = "0.1.5"
edition = "2024"
# Edition 2024 requires 1.85; without this Cargo fails with an opaque
# "feature `edition2024` is required" instead of naming the toolchain.
rust-version = "1.85"

[dependencies]
io-uring = "0.7"
pico-args = "0.5"
itoa = "1.0"
ryu = "1.0"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
