# wire_probe collectd plugin
# TCP-handshake RTT at L4 — drop-in replacement for the ICMP ping plugin.
#
# Prerequisites
# -------------
# 1. collectd built with Python plugin support  (LoadPlugin python)
# 2. Python 3.6+ available to collectd
# 3. wire-probe server running on each target host:
#      wire-probe --mode server --port 9999
#    By default the server binds to 0.0.0.0. To restrict to one interface:
#      wire-probe --mode server --port 9999 --bind 10.0.0.5
#
# Metric names produced (identical to the ping plugin — reuses types.db):
#   wire_probe/ping-<host>          RTT average (ms)
#   wire_probe/ping_droprate-<host> fraction of failed connects  [0.0–1.0]
#   wire_probe/ping_stddev-<host>   RTT standard deviation (ms)
#
# Drop this file into /etc/collectd/conf.d/  (or include it from collectd.conf)
# and adjust ModulePath to wherever wire_probe.py is installed.

LoadPlugin python

<Plugin python>
  ModulePath "/usr/lib/collectd/wire_probe"
  LogTraces true
  Interactive false
  Import "wire_probe"

  <Module wire_probe>
    # --- Target hosts -------------------------------------------------------
    # Plain hostname  →  uses the global Port below.
    # hostname:port   →  per-host port override (useful when each service
    #                    exposes a different port).

    Host "db-node-01"
    Host "db-node-02"
    Host "app-node-01"

    # --- Global settings ----------------------------------------------------
    # TCP port where wire-probe server is listening on each target host.
    Port 9999

    # Connect timeout in seconds (float).  Keep below the collectd Interval
    # to avoid blocking the read thread.
    Timeout 5.0

    # Number of TCP handshakes per host per read cycle.
    # 1  →  single sample (lowest overhead, no stddev)
    # 3+ →  average + stddev reported, higher load on targets
    PingCount 1
  </Module>
</Plugin>
